spring.application.name=api
spring.datasource.url=${DAWAK_DATABASE_URL:jdbc:postgresql://localhost:5434/dawak}
spring.datasource.username=${DAWAK_DATABASE_USERNAME:dawak}
spring.datasource.password=${DAWAK_DATABASE_PASSWORD:dawak}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

dawak.logging.http.include-bodies=${DAWAK_HTTP_LOG_BODIES:true}
dawak.logging.http.max-payload-length=${DAWAK_HTTP_LOG_MAX_PAYLOAD_LENGTH:8192}
logging.pattern.level=%5p [requestId:%X{requestId:-none}]

dawak.auth.otp-ttl=5m
dawak.auth.otp-max-attempts=5
dawak.auth.otp-request-limit=5
dawak.auth.otp-request-window=15m
dawak.auth.otp-pepper=${DAWAK_OTP_PEPPER}
dawak.auth.otp-delivery=${DAWAK_OTP_DELIVERY:log}
dawak.auth.access-token-ttl=15m
dawak.auth.refresh-token-ttl=30d
dawak.auth.jwt-secret=3fW9zK8qL2vN7xR4mT6cY1pH5bJ0sD8uA9eG2kQ7nV4wX6rZ
dawak.policy.terms-version=1.0
dawak.policy.privacy-version=1.0
