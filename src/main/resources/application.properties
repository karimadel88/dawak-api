spring.application.name=api
spring.datasource.url=${DAWAK_DATABASE_URL:jdbc:postgresql://localhost:5434/dawak}
spring.datasource.username=${DAWAK_DATABASE_USERNAME:dawak}
spring.datasource.password=${DAWAK_DATABASE_PASSWORD:dawak}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

dawak.logging.http.include-bodies=${DAWAK_HTTP_LOG_BODIES:true}
dawak.logging.http.max-payload-length=${DAWAK_HTTP_LOG_MAX_PAYLOAD_LENGTH:8192}
logging.pattern.level=%5p [requestId:%X{requestId:-none}]

dawak.auth.otp-ttl=5m
dawak.auth.otp-max-attempts=5
dawak.auth.otp-request-limit=5
dawak.auth.otp-request-window=15m
dawak.auth.otp-pepper=${DAWAK_OTP_PEPPER}
dawak.auth.otp-delivery=${DAWAK_OTP_DELIVERY:log}
dawak.auth.access-token-ttl=15m
dawak.auth.refresh-token-ttl=30d
dawak.auth.jwt-secret=3fW9zK8qL2vN7xR4mT6cY1pH5bJ0sD8uA9eG2kQ7nV4wX6rZ
dawak.policy.terms-version=1.0
dawak.policy.privacy-version=1.0

dawak.prescription.max-file-size=${DAWAK_PRESCRIPTION_MAX_FILE_SIZE:10485760}
dawak.prescription.upload-ttl=${DAWAK_PRESCRIPTION_UPLOAD_TTL:15m}
dawak.prescription.access-ttl=${DAWAK_PRESCRIPTION_ACCESS_TTL:2m}
dawak.prescription.retention-period=${DAWAK_PRESCRIPTION_RETENTION_PERIOD:365d}
dawak.prescription.storage-path=${DAWAK_PRESCRIPTION_STORAGE_PATH:/tmp/dawak-private-prescriptions}
dawak.prescription.encryption-secret=${DAWAK_PRESCRIPTION_ENCRYPTION_SECRET:local-only-prescription-encryption-secret-change-me}
dawak.prescription.storage-type=${DAWAK_PRESCRIPTION_STORAGE_TYPE:minio}
dawak.prescription.scanner-type=${DAWAK_PRESCRIPTION_SCANNER_TYPE:clamav}
dawak.prescription.minio-endpoint=${DAWAK_MINIO_ENDPOINT:http://localhost:9000}
dawak.prescription.minio-access-key=${DAWAK_MINIO_ACCESS_KEY:9v09so39P1WdCJvuLlAh}
dawak.prescription.minio-secret-key=${DAWAK_MINIO_SECRET_KEY:CBWfwnNT1vBpOAcsgEo5HVRuHwtxO75eiVUiywb0}
dawak.prescription.minio-bucket=${DAWAK_MINIO_PRESCRIPTION_BUCKET:dawak-prescriptions}
dawak.prescription.minio-create-bucket=${DAWAK_MINIO_CREATE_BUCKET:true}
dawak.prescription.clamav-host=${DAWAK_CLAMAV_HOST:localhost}
dawak.prescription.clamav-port=${DAWAK_CLAMAV_PORT:3310}
dawak.prescription.clamav-connect-timeout=${DAWAK_CLAMAV_CONNECT_TIMEOUT:2s}
dawak.prescription.clamav-read-timeout=${DAWAK_CLAMAV_READ_TIMEOUT:30s}
dawak.prescription.retention-cleanup-cron=${DAWAK_PRESCRIPTION_RETENTION_CLEANUP_CRON:0 0 3 * * *}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
