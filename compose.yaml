services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dawak
      POSTGRES_USER: dawak
      POSTGRES_PASSWORD: dawak
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawak -d dawak"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dawak-postgres:/var/lib/postgresql/data

volumes:
  dawak-postgres:
